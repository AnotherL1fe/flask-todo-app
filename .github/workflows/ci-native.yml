name: CI for Flask App

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize SQLite DB
        run: |
          python -m flask --app manage db upgrade

      - name: Run linting (optional but recommended)
        run: |
          if command -v flake8 >/dev/null 2>&1; then flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics; fi
          if command -v pylint >/dev/null 2>&1; then pylint . || true; fi

      - name: Start Flask server in background
        run: |
          nohup python manage.py runserver --host 0.0.0.0 --port 5000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server and smoke test
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "Server is up!"
              curl -f http://localhost:5000/
              exit 0
            fi
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "Server process died. Log:"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          echo "Server did not respond in 30 seconds. Log:"
          cat server.log
          exit 1
