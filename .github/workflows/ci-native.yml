name: CI for Flask App

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize SQLite DB and run migrations (if any)
        run: |
          if [ -f init_db.py ]; then python init_db.py; fi

      - name: Run linting (optional but recommended)
        run: |
          if command -v flake8 >/dev/null 2>&1; then flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics; fi
          if command -v pylint >/dev/null 2>&1; then pylint . || true; fi

      - name: Start Flask server in background
        run: |
          export FLASK_APP=manage.py
          export FLASK_ENV=development
          nohup flask run --host=0.0.0.0 --port=5000 > server.log 2>&1 &
          sleep 5

      - name: Smoke test Flask server with curl
        run: |
          curl -f http://localhost:5000/ || (echo "Smoke test failed: server did not respond" && exit 1)

      - name: Show server logs (for debugging)
        if: always()
        run: cat server.log
